[build-system]
requires = [
    "hatchling>=1.6.0",
]
build-backend = "hatchling.build"

[project]
name = "pbdp"
requires-python = ">=3.8"
description = "Battery experiment import and segmentation; final maintenance release."
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Alexandru Pascu, Ferran Brosa Planella, W. Dhammika Widanage, Philip Grylls", email = "Ferran.Brosa-Planella@warwick.ac.uk" },
]
dependencies = [
    "pandas>=2.0",
    "numpy",
    "chardet",
    "openpyxl",
    "plotly",
    "ipykernel",
    "pyarrow",
    "jupyter_client",
    "jupyter_core",
]
dynamic = [
    "version",
]

[project.urls]
Repository = "https://github.com/paramm-team/pbdp"
Documentation = "https://github.com/paramm-team/pbdp/blob/main/README.md"
Changelog = "https://github.com/paramm-team/pbdp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "nox",
    "coverage",
    "black",
    "flake8>=3",
    "pytest",
]
docs = [
    "guzzle-sphinx-theme",
    "sphinx>=1.5",
    "sphinx-rtd-theme",
]

[tool.hatch.version]
path = "pbdp/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/pbdp",
    "/tests",
    "/docs",
    "/noxfile.py",
    "/CHANGELOG.md",
    "/MAINTENANCE.md",
    "/examples",
    "/tools",
    "/.flake8",
]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
]
